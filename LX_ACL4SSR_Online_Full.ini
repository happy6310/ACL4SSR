; === 广告拦截规则更新源直连 ===
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,adblockplus.org

; === 设备遥测/广告 SDK 屏蔽（REJECT） ===
; 乐视电视广告 SDK 频繁访问 av1.xdrig.com 导致 DNS 失败日志，域名实际不存在
ruleset=🛑 广告拦截,[]DOMAIN-SUFFIX,xdrig.com

; === 密码管理 / IP 检测走代理 ===
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,lastpass.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,ip.sb


; ============================================================================
; [优化1] 已删除原 26-48 行手写的苹果/微软/azure/MSN/MSN 直连规则
