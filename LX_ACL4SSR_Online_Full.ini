[custom]


; ==================== 1. 极高优先级：本地与特殊设备直连 ====================
; 确保 IPTV 网段 (32网段) 和特定设备绝对直连，不进入后续庞大的规则匹配
ruleset=🎯 全球直连,[]SRC-IP-CIDR,192.168.31.2/32
ruleset=🎯 全球直连,[]SRC-IP-CIDR,192.168.32.0/24
ruleset=🎯 全球直连,[]IP-CIDR,192.168.31.0/24,no-resolve
ruleset=🎯 全球直连,[]IP-CIDR,192.168.32.0/24,no-resolve
ruleset=🎯 全球直连,[]IP-CIDR,192.168.68.0/24,no-resolve



ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,cp-net.cn
ruleset=🎯 全球直连,[]DOMAIN-KEYWORD,cplotus
ruleset=🎯 全球直连,[]DOMAIN-KEYWORD,happyliu
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,akamai.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,3322.net
ruleset=🎯 全球直连,[]DOMAIN-KEYWORD,ifconfig.me
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,dyndns.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,ipinfo.io
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,ipify.org



; === 新增：针对 200.4.xx.xx 网段的直连规则 ===
;ruleset=🎯 全球直连,[]SRC-IP-CIDR,200.4.0.0/16
ruleset=🎯 全球直连,[]IP-CIDR,200.4.0.0/16,no-resolve


; ==================== 2. 个人自定义规则 (LX 系列) ====================
; 将你个人的规则放在最前，提高命中效率
ruleset=🎯 全球直连,https://raw.githubusercontent.com/happy6310/ACL4SSR/refs/heads/lx/LX_RULE_Direct.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/happy6310/ACL4SSR/refs/heads/lx/LX_RULE_Proxy.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/happy6310/ACL4SSR/refs/heads/lx/LX_RULE_Other.list







; ==================== 3. 广告拦截 (建议放在核心代理规则前) ====================
;ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
;ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list


ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list



ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaMedia.list

; ==================== 4. 核心服务代理规则 ====================
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list


; DNS 泄露防护与 Google 代理
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,xn--ngstr-lra8j.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,services.googleapis.cn
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,dns.google
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleCNProxyIP.list

; ==================== 5. 国内直连规则 (内存大头，放最后) ====================
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
; 如果内存报警，请在 OpenClash 设置中禁用 ChinaIp.list，改用内置 GEOIP
;ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIp.list
;国内 IP 直连（通过 GEOIP 规则实现）
ruleset=🎯 全球直连,[]GEOIP,CN,no-resolve
ruleset=🎯 全球直连,[]GEOIP,LAN,no-resolve

; ==================== 6. 兜底规则 ====================
ruleset=🐟 漏网之鱼,[]FINAL

; ==================== 策略组设置 ====================
; 自动选择： fallback 模式
custom_proxy_group=♻️ 自动选择`fallback`.*`http://www.gstatic.com/generate_204`300,,50
; 节点选择：首选自动，次选直连
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]DIRECT`[]🚀 手动切换
; 手动切换：展示所有可用节点
custom_proxy_group=🚀 手动切换`select`.*
; 全球直连
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
; 广告拦截
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
; 漏网之鱼：将原来的 fallback 改为 select 逻辑，防止 DIRECT 永远置顶
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]DIRECT`[]♻️ 自动选择

enable_rule_generator=true
overwrite_original_rules=true
