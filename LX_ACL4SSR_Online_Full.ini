ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,apifox.com

; === CDN / 诊断 / 统计直连（节省代理流量） ===
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,akamai.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,akamaized.net
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,datadoghq.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,exp-tas.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,dns-finder.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,btloader.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,ad-delivery.net
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,doubleclick.net
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,scorecardresearch.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,mediav.com

; === 字节 / DeepSeek / 前端公共库直连 ===
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,byted.org
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,deepseek.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,unpkg.com

; === VS Code CDN 直连 ===
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,vscode-cdn.net
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,visualstudio.com

; === PT 站直连（强烈建议） ===
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,btschool.club
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,piggo.me
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,okpt.net
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,icc2022.xyz
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,leaves.red
