[custom]
; ============================================================================
; LX_ACL4SSR_Online_Full.ini  优化版
; 基于: https://github.com/happy6310/ACL4SSR/blob/lx/LX_ACL4SSR_Online_Full.ini
; 优化日期: 2026-08-02
;
; 主要优化点（与原版对比）:
;   [优化1] 删除重复的苹果/微软/azure/MSN 手写直连规则（原 26-48 行）
;          原因: 这些规则在后面的 Apple.list/Microsoft.list 规则集里已覆盖
;          手写规则先命中会导致后置规则集永远不生效，且策略组无法切换
;   [优化2] 广告规则源 BanAD.list → anti-AD（更活跃，覆盖更全）
;   [优化3] 策略组适度精简（保留核心组，删除用不上的地区组结构）
;          原因: 当前仅 1 个节点，地区 url-test 组全部为空，启动时反复测速失败占内存
;          未来增加节点时可在策略组里加回地区组
;   [优化4] 启用 clash_rule_base（指定精简 base 模板）
;   [优化5] 补充注释，规范分组
;
; 使用方法:
;   1. 将本文件上传到 GitHub 仓库 happy6310/ACL4SSR 的 lx 分支
;   2. 订阅地址保持不变: https://myurls.happyliu.top/happyliu_home
;   3. 路由器 OpenClash 更新订阅即可生效
; ============================================================================


; ==================== 1. 前置规则（个人定制，优先级最高） ====================
; 确保 IPTV 网段 (32网段) 和特定设备绝对直连，不进入后续庞大的规则匹配
ruleset=🎯 全球直连,[]SRC-IP-CIDR,192.168.31.2/32
ruleset=🎯 全球直连,[]SRC-IP-CIDR,192.168.32.0/24
ruleset=🎯 全球直连,[]IP-CIDR,192.168.31.0/24,no-resolve
ruleset=🎯 全球直连,[]IP-CIDR,192.168.32.0/24,no-resolve
ruleset=🎯 全球直连,[]IP-CIDR,192.168.68.0/24,no-resolve
ruleset=🎯 全球直连,[]DOMAIN-KEYWORD,happyliu

; === cpgroup 直连 ===
ruleset=🎯 全球直连,[]DOMAIN-KEYWORD,cplotus
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,cp-net.cn
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,icoremail.net

; === 200.4.xx.xx 网段直连 ===
ruleset=🎯 全球直连,[]IP-CIDR,200.4.0.0/16,no-resolve

; === DDNS / IP 检测相关直连 ===
; 注意: ifconfig.me / ipinfo.io / ipify.org 用 Cloudflare CDN，国内直连被拒
; 这三个域名走代理（LX_RULE_Proxy.list 里已有规则），这里不设直连

ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,3322.net
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,dyndns.com

; === 微信 / 协作工具直连 ===
